name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable repository pnpm version
        run: |
          corepack enable
          corepack install
          node --version
          pnpm --version

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: |
          if ! pnpm verify > /tmp/verify.log 2>&1; then
            tail -n 250 /tmp/verify.log
            exit 1
          fi
          tail -n 250 /tmp/verify.log
